# OpenShip deployment variant of docker-compose.yml.
#
# Differences from docker-compose.yml, and why:
#   * No `env_file:` blocks. OpenShip does not model that key, so it would be
#     ignored anyway. Set every variable in the project's Environment tab
#     instead - see deploy/openship.env.example for the list.
#   * No host port publishes. Ports 80/443 on the server belong to OpenShip's
#     edge, which routes a domain to a container port. The `ports` below are
#     container-only (no `host:container` mapping); attach domains in the UI.
#   * No ./config bind mount. That folder is gitignored, so it does not exist
#     after a clone. Without it Firebase Admin falls back to its demo
#     certificate (a warning in the log); the app still runs.
#   * Longer healthcheck start period: the backend preloads embedding models
#     and runs migrations before it answers, which takes minutes on a fresh
#     deploy, not the 10s the local compose file allows.
#
# In the OpenShip deploy wizard, set the Compose file path to:
#   docker-compose.openship.yml

services:
  frontend:
    image: chattermate/frontend:latest
    ports:
      - "8001"
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    image: chattermate/backend:latest
    ports:
      - "8000"
    environment:
      - REDIS_ENABLED=true
      - REDIS_URL=redis://redis:6379/0
      - WORKERS=1
      - TIMEOUT=120
      - LOG_LEVEL=info
      # HuggingFace caching configuration
      - HF_HOME=/app/.cache/huggingface
      - HF_HUB_CACHE=/app/.cache/huggingface/hub
      - HF_HUB_DISABLE_TELEMETRY=1
      # Reduce parallelism to avoid conflicts
      - EMBEDDING_MAX_WORKERS=4
      - KB_MAX_WORKERS=4
      # Enable safe embedding mode for Docker
      - EMBEDDING_SINGLE_THREADED=true
      - EMBEDDING_SEQUENTIAL_FALLBACK=true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      - backend_data:/app/uploads
      - temp_data:/app/temp
      - huggingface_cache:/app/.cache/huggingface
    healthcheck:
      test: ["CMD", "curl", "-X", "GET", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  knowledge_processor:
    image: chattermate/backend:latest
    command: python -m app.workers.knowledge_processor
    environment:
      - REDIS_ENABLED=true
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=info
      - PYTHONUNBUFFERED=1
      - HF_HOME=/app/.cache/huggingface
      - HF_HUB_CACHE=/app/.cache/huggingface/hub
      - HF_HUB_DISABLE_TELEMETRY=1
      - EMBEDDING_MAX_WORKERS=2
      - KB_MAX_WORKERS=2
      - EMBEDDING_SINGLE_THREADED=true
      - EMBEDDING_SEQUENTIAL_FALLBACK=true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    volumes:
      - backend_data:/app/uploads
      - temp_data:/app/temp
      - huggingface_cache:/app/.cache/huggingface
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  crm_sync:
    image: chattermate/backend:latest
    command: python -m app.workers.crm_sync
    environment:
      - LOG_LEVEL=info
      - PYTHONUNBUFFERED=1
    depends_on:
      db:
        condition: service_healthy
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  ticket_investigator:
    image: chattermate/backend:latest
    command: python -m app.workers.ticket_investigator
    environment:
      - REDIS_ENABLED=true
      - REDIS_URL=redis://redis:6379/0
      - LOG_LEVEL=info
      - PYTHONUNBUFFERED=1
      - HF_HOME=/app/.cache/huggingface
      - HF_HUB_CACHE=/app/.cache/huggingface/hub
      - HF_HUB_DISABLE_TELEMETRY=1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: always
    volumes:
      - huggingface_cache:/app/.cache/huggingface
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db:
    build:
      context: .
      dockerfile: Dockerfile.postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=chattermate
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru

volumes:
  postgres_data:
  redis_data:
  backend_data:
  temp_data:
  huggingface_cache:
